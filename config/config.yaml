# Kuavo Robot Configuration
# Consolidated from config.txt and hardcoded values across the codebase.

# --- MQTT ---
mqtt:
  mode: agent
  client_id: lwsMqttClient
  username: lwsUser
  password: mySecretPassword
  address: 127.0.0.1
  mqtt_broker: 127.0.0.1
  host: 127.0.0.1
  port: 1883
  mqtt_port: 1883
  in_port: 1110
  out_port: 1150
  qos: 0
  robot_id: 1
  topics:
    - test/topic0
    - test/topic1

# --- UDP Network ---
# TWO UDP server, one for left and one for right leg.
udp:
  server_ip: 0.0.0.0
  base_local_port: 8887       # localPort  = base_local_port  + server_id * 2
  base_remote_port: 8886      # remotePort = base_remote_port + server_id * 2
  client_ip:
    left: 127.0.0.1           # hardware: 192.168.4.101
    right: 127.0.0.1          # hardware: 192.168.4.103

# --- IMU Interface ---
imu:
  server_ip: 127.0.0.1
  local_port: 8890            # localPort  = base_local_port  + server_id * 2
  value_mode: float           # float or int
  base_id: 0x514

# --- Motor ---
motor:
  observer_ip: 127.0.0.1      # m_observer.wantedIP
  max_can_device: 7            # device_id < 7 -> server 0 (left), >= 7 -> server 1 (right)
  motors_per_leg: 6
  types:
    DM8009:
      id: 0
      position_max: 12.5      # rad
      velocity_max: 45         # rad/s
      torque_max: 54           # Nm
    DM10010L:
      id: 1
      position_max: 12.5      # rad
      velocity_max: 25         # rad/s
      torque_max: 200          # Nm

  legs:
    left:
      base_id: 1
      device_ids: [ 1, 2, 3, 4, 5, 6 ]
      motor_type: DM8009
      server_id: 0
    right:
      base_id: 7
      device_ids: [ 7, 8, 9, 10, 11, 12 ]
      motor_type: DM8009
      server_id: 1

# --- Logger settings ---
logger:
  path: "./logs/kuavo.log"
  level: debug
  maxSize: 10485760
  rotation: 3

data_logger:
  enabled: true
  downsample_every: 5
  drain_batch_size: 10
  ring_buffer_capacity: 256

# --- Driver Station ---
driver_station:
  udp_port: 61123
  buttons:
    1: "enable_left_leg"
    2: "disable_left_leg"
    3: "enable_right_leg"
    4: "disable_right_leg"
    lb_rb: "enable_all_motors"
    back_start: "emergency_stop"
